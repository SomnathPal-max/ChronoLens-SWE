[project]
name = "chronolens-swe"
version = "0.1.0"
description = "ChronoLens-SWE: AI-powered visual regression debugger using Meta SAM 3.1"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
